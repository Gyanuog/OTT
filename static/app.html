<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Local Tube</title>
<link rel="preconnect" href="https://i.ytimg.com">
<style>
/* =====================================================================
   Local Tube — Android app UI (separate from the web UI in index.html)
   ===================================================================== */
:root{
  --bg:#0a0a0c;--bg-2:#111115;--card:#16161b;--card-2:#1f1f26;--fg:#f5f5f7;--fg-2:#c9c9d2;--muted:#8d8d99;
  --line:rgba(255,255,255,.08);--accent:#ff3d6e;--accent-2:#ff7a45;--accent-soft:rgba(255,61,110,.16);
  --grad:linear-gradient(135deg,var(--accent),var(--accent-2));
  --glass:rgba(10,10,12,.78);--sheet:#18181d;--shadow:0 12px 40px rgba(0,0,0,.55);
  --tab-h:64px;--bar-h:56px;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f6f9;--bg-2:#ffffff;--card:#ffffff;--card-2:#ececf1;--fg:#0e0e12;--fg-2:#35353d;--muted:#6f6f7b;
  --line:rgba(0,0,0,.08);--accent:#e8245a;--accent-2:#ff6a3d;--accent-soft:rgba(232,36,90,.12);
  --glass:rgba(246,246,249,.82);--sheet:#ffffff;--shadow:0 12px 40px rgba(20,20,30,.16);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:18px;height:18px}.i.xs{width:14px;height:14px}.i.lg{width:30px;height:30px}.i.xl{width:40px;height:40px}
.i.fill{fill:currentColor;stroke:none}
.press{transition:transform .14s var(--ease),background .2s,opacity .2s}
.press:active{transform:scale(.94)}
.m{color:var(--muted)}

/* ---------- app bar ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:var(--bar-h);padding:0 8px 0 14px;background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);transition:transform .28s var(--ease)}
.bar.hide{transform:translateY(-100%)}
.bar.sub{padding-left:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;min-width:0}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(255,61,110,.4);flex:none}
.logo .i{width:13px;height:13px}
.brand small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:-4px}
.bar-title{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--fg-2);flex:none;transition:background .2s,color .2s,transform .14s var(--ease)}
.ib:active{background:var(--card-2);transform:scale(.9)}
.ib.on{color:var(--accent);background:var(--accent-soft)}

/* ---------- views ---------- */
#view{min-height:calc(100vh - var(--bar-h));padding-bottom:calc(var(--tab-h) + 24px)}
body.has-mini #view{padding-bottom:calc(var(--tab-h) + 96px)}
.enter{animation:enter .32s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec{margin:6px 0 22px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:10px}
.sec-h h2{margin:0;font-size:17px;font-weight:750;letter-spacing:-.01em}
.sec-h .m{font-size:12.5px}
.pad{padding:0 16px}

/* chips */
.chips{position:sticky;top:var(--bar-h);z-index:20;display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;background:var(--bg);scrollbar-width:none;transition:top .28s var(--ease)}
body.bar-hidden .chips{top:0}
.chips::-webkit-scrollbar,.hrow::-webkit-scrollbar,.hero-car::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:10px;background:var(--card-2);color:var(--fg-2);font-weight:600;font-size:13px;white-space:nowrap;transition:background .2s,color .2s,transform .14s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--fg);color:var(--bg)}
.chip .i{width:15px;height:15px;vertical-align:-3px;margin-right:4px}

/* hero carousel */
.hero-car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 0;scrollbar-width:none;scroll-padding:0 16px}
.slide{position:relative;flex:0 0 100%;aspect-ratio:4/5;max-height:62vh;border-radius:22px;overflow:hidden;scroll-snap-align:center;background:var(--card);isolation:isolate;box-shadow:var(--shadow)}
.slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:-2}
.slide::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(6,6,8,.96) 0%,rgba(6,6,8,.55) 38%,rgba(6,6,8,0) 66%)}
.slide-in{position:absolute;left:18px;right:18px;bottom:18px;color:#fff}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.slide h3{margin:6px 0 6px;font-size:23px;line-height:1.12;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slide img.lg{display:block;max-width:70%;max-height:86px;object-fit:contain;object-position:left bottom;margin:8px 0}
.slide p{margin:0 0 14px;font-size:13px;color:rgba(255,255,255,.78);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:14px;background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.primary{background:#fff;color:#0b0b0e}
.btn.accent{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(255,61,110,.35)}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 18px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--card-2);transition:width .3s var(--ease),background .3s}
.dots i.on{width:22px;background:var(--accent)}

/* horizontal rows */
.hrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;scroll-padding:0 16px;scrollbar-width:none}
.hrow>*{scroll-snap-align:start;flex:none}
.hrow .vcard{width:76%}
.hrow .pcard{width:124px}

/* video card */
.vcard{display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--card-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s,transform .3s var(--ease)}
.thumb img.ok{opacity:1}
.vcard:active .thumb img,.pcard:active .thumb img,.ep:active .thumb img{transform:scale(.97)}
.badge{position:absolute;bottom:7px;right:7px;font-size:11px;font-weight:700;line-height:1;padding:4px 6px;border-radius:6px;background:rgba(0,0,0,.78);color:#fff}
.badge.live{background:var(--accent)}
.badge.tag{left:7px;right:auto;top:7px;bottom:auto}
.vcard .info{display:flex;gap:10px;padding:10px 2px 0}
.ava{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.vcard .t{font-weight:650;font-size:14.5px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard .s{margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlist{display:grid;gap:22px;padding:0 16px}
.vlist .thumb{border-radius:16px}
.locked .thumb img{filter:grayscale(.7) brightness(.6)}

/* poster card */
.pcard{display:block}
.pcard .thumb{aspect-ratio:2/3;border-radius:14px}
.pcard .t{margin-top:7px;font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .s{font-size:11.5px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:0 16px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--card) 0%,var(--card-2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.1s ease-in-out infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.sk-line{height:12px;margin-top:10px;border-radius:6px}

/* empty / error */
.empty{display:grid;place-items:center;text-align:center;padding:64px 24px;color:var(--muted)}
.empty .big{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--card-2);color:var(--fg-2);margin-bottom:14px}
.empty h3{margin:0 0 4px;color:var(--fg);font-size:18px}
.err{color:var(--accent)}

/* show page */
.show-hero{position:relative;margin:-56px 0 0;padding:72px 16px 18px;color:#fff;isolation:isolate;overflow:hidden;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end}
.show-hero .bd{position:absolute;inset:0;background:center/cover no-repeat;z-index:-2;transform:scale(1.05)}
.show-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 0%,rgba(10,10,12,.75) 35%,rgba(10,10,12,.25) 75%,rgba(10,10,12,.55) 100%)}
:root[data-theme="light"] .show-hero{color:var(--fg)}
:root[data-theme="light"] .show-hero::after{background:linear-gradient(0deg,var(--bg) 0%,rgba(246,246,249,.85) 40%,rgba(246,246,249,.2) 80%)}
.show-hero h1{margin:6px 0 8px;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.show-hero p{margin:0 0 16px;font-size:13.5px;opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.show-hero p.open{-webkit-line-clamp:unset}
:root[data-theme="light"] .show-hero .eyebrow{color:var(--muted)}
.eps{display:grid;gap:4px;padding:0 10px}
.ep{display:grid;grid-template-columns:136px 1fr;gap:12px;align-items:center;padding:8px 6px;border-radius:14px;transition:background .2s}
.ep:active{background:var(--card)}
.ep.cur{background:var(--accent-soft)}
.ep .thumb{border-radius:10px}
.ep .no{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.05em}
.ep .t{font-weight:650;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .s{font-size:12px;color:var(--muted);margin-top:2px}

/* settings */
.group{margin:8px 16px 20px;background:var(--card);border-radius:18px;overflow:hidden}
.group-t{margin:18px 20px 8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row-i{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);transition:background .2s}
.row-i:last-child{border-bottom:0}
.row-i:active{background:var(--card-2)}
.row-i .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);flex:none}
.row-i .tx{flex:1;min-width:0}
.row-i .tx b{display:block;font-weight:650;font-size:14.5px}
.row-i .tx span{font-size:12.5px;color:var(--muted)}
.row-i .val{font-size:13px;color:var(--muted);font-weight:600}
.tog{position:relative;width:46px;height:28px;border-radius:99px;background:var(--card-2);flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.tog.on{background:var(--accent)}.tog.on::after{transform:translateX(18px)}
.segc{display:flex;background:var(--card-2);border-radius:12px;padding:3px;gap:2px}
.segc button{flex:1;height:34px;border-radius:9px;font-weight:650;font-size:13px;color:var(--muted);transition:background .2s,color .2s;padding:0 10px}
.segc button.on{background:var(--bg-2);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ---------- bottom tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:var(--tab-h);background:var(--glass);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:650}
.tab .pill{display:grid;place-items:center;width:58px;height:30px;border-radius:99px;transition:background .3s var(--ease),color .3s,transform .2s var(--ease)}
.tab:active .pill{transform:scale(.88)}
.tab.on{color:var(--fg)}
.tab.on .pill{background:var(--accent-soft);color:var(--accent)}
.tab .i{width:21px;height:21px}

/* pull to refresh */
.ptr{position:fixed;left:50%;top:calc(var(--bar-h) - 44px);z-index:25;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--sheet);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);opacity:0;transform:translateY(0) scale(.6);pointer-events:none}
.ptr.spin svg{animation:rot .8s linear infinite}

/* ---------- search ---------- */
.search{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:fadeup .22s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.s-top{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 4px}
.s-box{flex:1;display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 14px;border-radius:999px;background:var(--card-2);border:1.5px solid transparent;transition:border-color .2s}
.s-box:focus-within{border-color:var(--accent)}
.s-box input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15.5px}
.s-src{padding:4px 14px 12px}
.s-body{flex:1;overflow-y:auto;padding:6px 16px 24px}
.s-sug{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}
.s-sug .i{color:var(--muted)}
.s-sug span{flex:1}

/* ---------- bottom sheet ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:78vh;display:flex;flex-direction:column;background:var(--sheet);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4);transform:translateY(100%);transition:transform .3s var(--ease)}
.sheet.show{transform:none}
.sheet .grab{padding:10px 0 4px;touch-action:none}
.sheet .grab i{display:block;width:40px;height:4px;border-radius:99px;background:var(--muted);opacity:.4;margin:0 auto}
.sheet h4{margin:4px 22px 8px;font-size:16px;font-weight:750}
.sheet .opts{overflow-y:auto;padding:0 10px 18px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:8px 14px;border-radius:14px;text-align:left;font-size:15px;font-weight:550;transition:background .15s}
.opt:active{background:var(--card-2)}
.opt .ic{color:var(--fg-2)}
.opt .tx{flex:1}
.opt .tx small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.opt .val{font-size:13px;color:var(--muted)}
.opt.on{color:var(--accent);font-weight:750}
.opt.on .ic{color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px);z-index:90;transform:translate(-50%,12px);max-width:86vw;padding:11px 18px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600;font-size:13.5px;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.watching .toast{bottom:28px}

/* ===================== WATCH LAYER ===================== */
.watch{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(100%);transition:transform .34s var(--ease),border-radius .34s;will-change:transform}
.watch.open{transform:none}
.watch.drag{transition:none}
.wscroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.stage{position:sticky;top:0;z-index:5;aspect-ratio:16/9;width:100%;background:#000;overflow:hidden;isolation:isolate;touch-action:none}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage.fill video{object-fit:cover}
.stage video.standby{z-index:-1;pointer-events:none}
.stage .freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none}
.stage.switching .freeze{display:block}
.stage .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.stage.audio-mode .poster{display:block;filter:blur(2px) brightness(.45)}
.stage.audio-mode video{visibility:hidden}
.amark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;color:#fff;opacity:.9}
.stage.audio-mode .amark{display:block}
.stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh}
.stage:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh}

/* player controls */
.ctl{position:absolute;inset:0;z-index:3;color:#fff;opacity:0;transition:opacity .22s;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.7) 100%),rgba(0,0,0,.22)}
.stage.show-ctl .ctl{opacity:1;pointer-events:auto}
.ctl .ib{color:#fff;width:44px;height:44px}
.ctl .ib:active{background:rgba(255,255,255,.18)}
.ctl-top{position:absolute;left:4px;right:4px;top:4px;display:flex;align-items:center;gap:2px}
.ctl-top .ttl{flex:1;min-width:0;font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
.stage.fs .ctl-top .ttl{opacity:1}
.ctl-mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(20px,10vw,64px)}
.cb{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:#fff;background:rgba(0,0,0,.28);transition:transform .14s var(--ease),background .2s}
.cb:active{transform:scale(.86);background:rgba(255,255,255,.2)}
.cb.big{width:66px;height:66px;background:rgba(0,0,0,.38)}
.cb[disabled]{opacity:.3}
.cb .sub{position:absolute;font-size:9px;font-weight:800;margin-top:2px}
.stage.loading .cb.big{opacity:0}
.ctl-bot{position:absolute;left:0;right:0;bottom:0;padding:0 6px 14px 14px;display:flex;align-items:center;gap:6px}
.time{font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.time .m{color:rgba(255,255,255,.7)}
.stage.fs .ctl-bot{padding-bottom:26px}
/* seek bar */
.seek{position:absolute;left:0;right:0;bottom:-8px;height:22px;z-index:4;touch-action:none;display:flex;align-items:center;padding:0}
.stage.fs .seek{left:14px;right:14px;bottom:8px}
.seek .rail{position:relative;width:100%;height:3px;background:rgba(255,255,255,.25);transition:height .15s}
.seek .buf,.seek .pos{position:absolute;left:0;top:0;bottom:0;width:0}
.seek .buf{background:rgba(255,255,255,.4)}
.seek .pos{background:var(--accent)}
.seek .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s var(--ease);box-shadow:0 0 0 4px rgba(255,61,110,.25)}
.stage.show-ctl .seek .knob,.seek.drag .knob{transform:scale(1)}
.seek.drag .rail{height:5px}
.seek .sb{position:absolute;top:0;bottom:0;background:#ffd400}
.bubble{position:absolute;bottom:36px;transform:translateX(-50%);padding:5px 10px;border-radius:8px;background:rgba(0,0,0,.82);color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;pointer-events:none;display:none}
.seek.drag+.bubble,.bubble.show{display:block}
.stage:not(.show-ctl) .seek{pointer-events:none}
/* double tap ripple */
.rip{position:absolute;top:0;bottom:0;width:42%;z-index:2;display:grid;place-items:center;color:#fff;pointer-events:none;opacity:0;transition:opacity .3s}
.rip.l{left:0;border-radius:0 50% 50% 0/0 50% 50% 0;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,.2),rgba(255,255,255,.06) 60%)}
.rip.r{right:0;border-radius:50% 0 0 50%/50% 0 0 50%;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.2),rgba(255,255,255,.06) 60%)}
.rip.show{opacity:1}
.rip div{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px}
.hint{position:absolute;left:50%;top:14px;z-index:4;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.hint.show{opacity:1}
.spin{position:absolute;inset:0;z-index:2;display:none;place-items:center;pointer-events:none}
.spin::after{content:"";width:46px;height:46px;border-radius:50%;border:3.5px solid rgba(255,255,255,.2);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.stage.loading .spin{display:grid}
.thin{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);z-index:3;width:0;pointer-events:none}
.stage.show-ctl .thin{display:none}

/* watch details */
.wbody{padding:14px 16px 40px}
.wtitle{display:flex;gap:10px;align-items:flex-start}
.wtitle h1{flex:1;margin:0;font-size:17.5px;line-height:1.3;font-weight:750;letter-spacing:-.01em}
.wmeta{margin-top:5px;font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;background:var(--card-2);color:var(--fg);font-weight:650;font-size:13px;white-space:nowrap;transition:background .2s,color .2s,transform .14s var(--ease)}
.act:active{transform:scale(.94)}
.act.on{background:var(--accent-soft);color:var(--accent)}
.act .i{width:17px;height:17px}
.epnav{display:flex;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.epnav:empty{display:none}
.desc{margin:14px 0 4px;padding:12px 14px;border-radius:16px;background:var(--card);font-size:13px;color:var(--fg-2);white-space:pre-wrap;word-break:break-word;max-height:5.2em;overflow:hidden;position:relative;-webkit-user-select:text;user-select:text}
.desc:empty{display:none}
.desc:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(transparent,var(--card))}
.desc.open{max-height:none}
.chaps{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.chaps:empty{display:none}
.side-h{margin:22px 0 10px;font-size:16px;font-weight:750}
.side-h:empty{display:none}
.side{display:grid;gap:4px;margin:0 -10px}
.mini-i{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:6px;border-radius:14px}
.mini-i:active{background:var(--card)}
.mini-i.cur{background:var(--accent-soft)}
.mini-i .thumb{border-radius:10px}
.mini-i .t{font-weight:650;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-i .s{margin-top:3px;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* mini player */
.minibar{display:none}
.watch.mini{top:auto;left:8px;right:8px;bottom:calc(var(--tab-h) + 8px);height:66px;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);transform:none}
.watch.mini .wscroll{overflow:hidden}
.watch.mini .stage{position:absolute;left:0;top:0;width:118px;height:66px;aspect-ratio:auto}
.watch.mini .wbody,.watch.mini .ctl,.watch.mini .seek,.watch.mini .bubble,.watch.mini .hint,.watch.mini .rip{display:none}
.watch.mini .thin{display:block!important}
.watch.mini .minibar{display:flex;position:absolute;left:118px;right:0;top:0;bottom:0;align-items:center;gap:2px;padding:0 4px 0 12px}
.minibar .tx{flex:1;min-width:0}
.minibar b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar .ib{color:var(--fg)}
.watch.mini .spin::after{width:22px;height:22px;border-width:2.5px}
.watch.mini .amark{display:none}

/* landscape (non-fullscreen): bigger player */
@media (orientation:landscape) and (max-height:500px){
  .watch:not(.mini) .stage{aspect-ratio:auto;height:100vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
